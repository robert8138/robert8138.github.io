#-------------------------------
## Bookshelf
#
# Shelves mirror the Tags on the "Book Summary" database in Notion, so the
# categorisation here and there stay the same.
#
# Covers come from Open Library. Two fields, doing two different jobs:
#
#   isbn      the book's identity, and the JOIN KEY to _books/*.md. A cover
#             on the shelf only becomes a link once a file there carries a
#             matching isbn.
#   cover_id  an Open Library *cover* ID. This is the cover OL picked for the
#             work, so it is the edition a reader recognises. Resolving by
#             isbn alone tends to surface foreign-language or audiobook
#             jackets, so prefer this.
#
# Both are produced by tools/resolve_isbn.py, which searches Open Library by
# title + author. Title alone is not safe: it fuzzy-matches, so "Grit" finds
# "True Grit" and "Range" finds "Close Range". Always eyeball new covers.
#
# Book fields: title, author, isbn, cover_id, link (optional, external)
#-------------------------------

